# Both models run through the SAME OpenCode harness (`opencode run`).
# Only the model differs. Both models use the OpenAI provider authenticated
# through ChatGPT Plus. Catalog status confirmed 2026-09-23.
models:
  - logical_name: "sol"
    display_name: "GPT-6 Sol"
    family: "GPT-6 Sol"
    opencode_model_id: "openai/gpt-6-sol"
    provider: "openai"
    reasoning_effort: "medium"
    reasoning_mapping: "--variant medium (+ provider model options reasoningEffort=medium where supported)"
    usage_support: "tokens+reasoning+cost via `opencode run --format json` step_finish events"
    status: "available via OpenAI provider authenticated through ChatGPT Plus"

  - logical_name: "luna"
    display_name: "GPT-6 Luna"
    family: "GPT-6 Luna"
    opencode_model_id: "openai/gpt-6-luna"
    provider: "openai"
    reasoning_effort: "medium"
    reasoning_mapping: "--variant medium (+ provider model options reasoningEffort=medium where supported)"
    usage_support: "tokens+reasoning+cost via `opencode run --format json` step_finish events"
    status: "available via OpenAI provider authenticated through ChatGPT Plus"
