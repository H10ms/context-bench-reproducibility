name: Verify public experiment
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-analysis.txt
      - run: python scripts/verify_release.py
      - run: python -m pip install -r requirements-analysis.txt
      - run: python scripts/reproduce.py
